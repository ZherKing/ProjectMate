# ProjectMate: EdgeOne -> HTTP :80 -> local app :3000.
# Install as /etc/nginx/conf.d/projectmate.conf (inside the existing http block).
# This is a site configuration, NOT a replacement for /etc/nginx/nginx.conf.
# Replace server_name _ with your public domain before installing.

map $http_upgrade $projectmate_connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve the visitor protocol when EdgeOne supplies it. Default to HTTPS
# because TLS terminates at EdgeOne; configure HTTPS redirects at the edge.
map $http_x_forwarded_proto $projectmate_forwarded_proto {
    default https;
    http    http;
    https   https;
}

server {
    listen 80;
    server_name match.mclzyun.com;

    server_tokens off;

    # App defaults to 20 MiB per file. Raise this if PROJECT_FILE_MAX_MB is raised.
    client_max_body_size 25m;
    client_body_timeout 120s;

    location / {
        # No trailing URI: preserve the original path and query string.
        proxy_pass http://127.0.0.1:3888;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $projectmate_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $projectmate_connection_upgrade;

        # Preserve incremental AI / MCP responses and avoid disk-buffered uploads.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        gzip off;

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
